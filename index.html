<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333333">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>4-Hands Timer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock-container">
    <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Background -->
      <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#333333" stroke-width="4"/>

      <!-- Tick marks -->
      <!-- Long ticks (every 5 seconds) -->
      <g stroke="#333333" stroke-width="3" stroke-linecap="round">
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(0 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(30 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(60 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(90 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(120 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(150 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(180 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(210 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(240 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(270 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(300 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="45" transform="rotate(330 250 250)"/>
      </g>

      <!-- Short ticks (remaining seconds) -->
      <g stroke="#333333" stroke-width="1.5" stroke-linecap="round">
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(6 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(12 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(18 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(24 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(36 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(42 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(48 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(54 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(66 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(72 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(78 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(84 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(96 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(102 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(108 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(114 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(126 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(132 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(138 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(144 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(156 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(162 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(168 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(174 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(186 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(192 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(198 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(204 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(216 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(222 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(228 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(234 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(246 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(252 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(258 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(264 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(276 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(282 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(288 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(294 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(306 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(312 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(318 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(324 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(336 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(342 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(348 250 250)"/>
        <line x1="250" y1="30" x2="250" y2="38" transform="rotate(354 250 250)"/>
      </g>

      <!-- Hands group (rotates together) -->
      <g id="hands">
        <!-- Red hand (up, 0°) -->
        <line x1="250" y1="250" x2="250" y2="50" stroke="#F44336" stroke-width="8" stroke-linecap="round"/>
        <!-- Yellow hand (right, 90°) -->
        <line x1="250" y1="250" x2="450" y2="250" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
        <!-- Green hand (down, 180°) -->
        <line x1="250" y1="250" x2="250" y2="450" stroke="#4CAF50" stroke-width="8" stroke-linecap="round"/>
        <!-- Blue hand (left, 270°) -->
        <line x1="250" y1="250" x2="50" y2="250" stroke="#2196F3" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- Center point -->
      <circle cx="250" cy="250" r="6" fill="#333333"/>
      <circle cx="250" cy="250" r="3" fill="#FFFFFF"/>
    </svg>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
